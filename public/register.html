<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียน</title>
  <!-- font-awesome@6.2.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

  <!-- jquery@3.6.0 -->
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>

  <link href="https://fastly.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@200;300&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai');

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans Thai', sans-serif;
    }

    body {
      background: rgb(252, 233, 233);
      background: linear-gradient(0deg, rgba(252, 233, 233, 1) 0%, rgba(224, 244, 241, 1) 26%, rgba(255, 255, 255, 1) 71%);
      background-size: cover;
      background-color: skyblue;
    }

    .list {
      background-color: #ffffff;
      padding: 1.8em 1.2em;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      border-radius: 0.6em;
    }

    label { color: black; }
    .container { max-width: 600px; }

    button[type="submit"] {
      font-family: 'Noto Sans Thai', sans-serif;
      width: 100%;
      margin: 10px auto 0;
      padding: 3%;
      background: #b26bc2;
      border: none;
      border-radius: 5px;
      font-size: 17px;
      color: #fff;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #FFCE00; color: #000; }
    button[type="submit"][disabled] { opacity: .6; cursor: default; }

    option:disabled { color: #999999 !important; background-color: #f0f0f0 !important; }
    .batch-selection { display: none; }
    .pill { display: inline-block; background: #e7faef; color: #05683a; border-radius: 999px; padding: 3px 10px; font-size: .8rem; margin: 3px 3px 0 0; }
    .pill.wait { background: #fef7e6; color: #b54708; }
  </style>
</head>

<body>
  <center>
    <br />
    <img src="https://lh3.googleusercontent.com/d/1uP_Qb7Yv69rp-X8SAFOr-A0uqmRJAbs7"
      style="width:200px; height:auto; padding-bottom: 10px;">
    <div class="form-group mb-2">
      <label><h3>ระบบลงทะเบียน</h3></label>
    </div>
  </center>

  <div class="container" id="app">
    <div class="list text-center">
      <div class="spinner-border text-secondary my-3" role="status"></div>
      <p class="text-muted">กำลังเชื่อมต่อ LINE…</p>
    </div>
  </div>

  <br />
  <div class="text-center p-4 col-12 mt-4" style="background-color: rgba(0, 0, 0, 0.05);">
    น้องพัสดุ ติวสอบ e-CPP
  </div>

  <script src="https://fastly.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://fastly.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://fastly.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>

  <script>
  (function () {
    'use strict';
    var qs = new URLSearchParams(location.search);
    var LIFF_ID = qs.get('liffId') || '2004722900-At6plwjk';   // <- LIFF ID ของหน้านี้
    var API = qs.get('api') || '';                              // ว่าง = โดเมนเดียวกัน (Vercel เดียวกับ backend)
    var $app = $('#app');
    var state = {};

    function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]; }); }
    function post(path, body) {
      return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || j.message || ('HTTP ' + r.status)); return j; }); });
    }
    function goNext(url) {
      if (url) { location.href = url; }
      else if (liff.isInClient && liff.isInClient()) { liff.closeWindow(); }
    }

    liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
      .then(function () {
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return null; }
        var tok = liff.getIDToken();
        if (!tok) throw new Error('ไม่พบ id token — ลองเปิดใหม่ในแอป LINE');
        state.idToken = tok;
        return post('/api/public/reg-check', { idToken: tok });
      })
      .then(function (res) {
        if (!res) return;
        state.check = res;
        if (res.isFriend === false) { showAddFriend(res); return; }   // ต้องเป็นเพื่อนกับบัญชีก่อน
        res.registered ? showRegistered(res) : showForm(res);
      })
      .catch(function (e) {
        $app.html('<div class="list text-center"><h4>เปิดไม่ได้</h4><p class="text-danger">' + esc(e.message) + '</p>'
          + '<button class="btn btn-outline-secondary" onclick="location.reload()">ลองใหม่</button></div>');
      });

    function showAddFriend(res) {
      var again = res.needsRereg;
      $app.html(
        '<div class="list text-center">' +
        '<div style="font-size:3rem">👋</div><h4>กรุณาเพิ่มเพื่อนก่อน</h4>' +
        '<p class="text-muted">' +
        (again ? 'คุณเคยลงทะเบียนไว้แล้ว แต่ยังไม่ได้เป็นเพื่อนกับบัญชี <b>น้องพัสดุ</b> ระบบจึงส่งข้อมูลและเมนูให้ไม่ได้<br>' : '') +
        'กดปุ่มด้านล่างเพื่อเพิ่มเพื่อน <b>น้องพัสดุ</b> (ถ้าเคยบล็อกไว้ ให้ปลดบล็อกก่อน) แล้วกลับมากด “ตรวจสอบอีกครั้ง” เพื่อ' +
        (again ? 'ลงทะเบียนใหม่' : 'ลงทะเบียน') + '</p>' +
        '<a id="addfriend" class="btn btn-success w-100 mb-2" href="' + esc(res.addFriendUrl) + '">➕ เพิ่มเพื่อน น้องพัสดุ</a>' +
        '<button type="button" id="recheck" class="btn btn-outline-secondary w-100">ฉันเพิ่มเพื่อนแล้ว — ตรวจสอบอีกครั้ง</button>' +
        '</div>');
      $('#addfriend').on('click', function (ev) {
        if (liff.isInClient && liff.isInClient()) { ev.preventDefault(); liff.openWindow({ url: res.addFriendUrl, external: false }); }
      });
      $('#recheck').on('click', function () { location.reload(); });
    }

    function showRegistered(res) {
      var items = (res.registrations || []).map(function (r) {
        return '<li class="d-flex justify-content-between align-items-center py-2 border-bottom">'
          + '<span>' + esc(r.course_raw || r.course) + '</span>'
          + (r.paid ? '<span class="pill">ชำระแล้ว</span>' : '<span class="pill wait">รอชำระ</span>') + '</li>';
      }).join('');
      $app.html(
        '<div class="list">' +
        '<div class="text-center"><div style="font-size:3rem">✅</div><h4>คุณลงทะเบียนแล้ว</h4>' +
        '<p class="text-muted">' + esc(res.displayName || '') + '</p></div>' +
        '<ul class="list-unstyled mb-3">' + items + '</ul>' +
        '<button type="submit" id="go">เข้าสู่บทเรียน / หน้าถัดไป</button>' +
        '</div>');
      $('#go').on('click', function () { goNext(res.nextUrl); });
    }

    function showForm(res) {
      $app.html(
        '<form id="myForm" class="needs-validation list" novalidate>' +
        '<div class="row justify-content-start g-3">' +
        '<div class="col-12"><label for="name"><i class="fa-solid fa-user"></i> ชื่อ-สกุล</label>' +
        '<input type="text" id="name" name="name" class="form-control" placeholder="ชื่อ-สกุล" value="' + esc(res.displayName || '') + '" required>' +
        '<div class="invalid-feedback">กรุณากรอกชื่อ-สกุล</div></div>' +

        '<div class="col-12"><label for="device"><i class="fa-regular fa-circle-user"></i> สังกัดหน่วยงาน</label>' +
        '<input type="text" id="device" name="device" class="form-control" placeholder="กรุณากรอกสังกัดของท่าน" required>' +
        '<div class="invalid-feedback">กรุณากรอกสังกัดของท่าน</div></div>' +

        '<div class="col-12"><label for="phone"><i class="fa-solid fa-phone"></i> เบอร์โทร</label>' +
        '<input type="text" id="phone" name="phone" maxlength="10" class="form-control" placeholder="กรุณาใส่เบอร์โทรของท่าน" required>' +
        '<div class="invalid-feedback">กรุณากรอกเบอร์โทรของท่าน</div></div>' +

        '<div class="col-12"><label for="place"><i class="fa-solid fa-envelope"></i> อีเมล</label>' +
        '<input type="email" id="place" name="place" class="form-control" placeholder="กรุณากรอก Email" required>' +
        '<div class="invalid-feedback">กรุณากรอกอีเมล</div></div>' +

        '<div class="col-12"><label for="problem"><i class="fa-solid fa-lock"></i> หลักสูตรที่ท่านจะสอบปี 70</label>' +
        '<select id="problem" name="problem" class="form-control" required>' +
        '<option value="">กรุณาเลือกหลักสูตร</option>' +
        '<option value="PC70">PC เตรียมความพร้อม</option>' +
        '<option value="FC70">FC ระดับต้น</option>' +
        '<option value="IC70">IC ระดับกลาง</option>' +
        '<option value="AC70" disabled>AC ระดับสูง</option>' +
        '</select><div class="invalid-feedback">กรุณาเลือกหลักสูตรที่ท่านจะสอบ</div></div>' +

        '<div class="col-12 batch-selection" id="batchSelection"><label for="batch"><i class="fa-solid fa-list-ol"></i> เลือกรุ่น</label>' +
        '<select id="batch" name="batch" class="form-control">' +
        '<option value="">กรุณาเลือกรุ่น</option><option value="รุ่น 1">รุ่น 1</option><option value="รุ่น 2">รุ่น 2</option>' +
        '</select><div class="invalid-feedback">กรุณาเลือกรุ่น</div></div>' +

        '<div class="col-12"><label for="examOrder"><i class="fa-solid fa-trophy"></i> ลำดับที่สอบผ่าน (หลักสูตรล่าสุด)</label>' +
        '<input type="text" id="examOrder" name="examOrder" class="form-control" placeholder="กรุณากรอกลำดับ" required>' +
        '<div class="invalid-feedback">กรุณากรอกลำดับที่สอบผ่าน(หลักสูตรล่าสุด)</div></div>' +

        '<div class="col-12"><label for="file"><i class="fa-solid fa-file"></i> อัพโหลดรูปประจำตัวของท่าน</label>' +
        '<input type="file" id="file" accept="image/*" class="form-control" required>' +
        '<div class="invalid-feedback">กรุณาอัพโหลดรูปประจำตัว</div></div>' +

        '<div class="col-12 text-center"><button type="submit" class="btn btn-warning w-100"><i class="bi bi-send-fill"></i>&nbsp;ลงทะเบียน</button></div>' +
        '</div></form>');

      $('#problem').on('change', function () {
        var selected = $(this).val();
        var $batch = $('#batchSelection'), $batchInput = $('#batch');
        if (selected === 'PC70') { $batch.show(); $batchInput.attr('required', true); }
        else { $batch.hide(); $batchInput.attr('required', false); $batchInput.val(''); }
      });

      $('#myForm').on('submit', function (event) {
        event.preventDefault();
        var form = this;
        if (!form.checkValidity()) {
          event.stopPropagation();
          $(form).addClass('was-validated');
          $(form).find(':invalid').first().focus();
          return;
        }
        submitForm();
      });

      // ลงทะเบียนใหม่ (เคยลงไว้ตอนยังไม่เป็นเพื่อน): เติมข้อมูลเดิมให้ — สถานะชำระเงินเดิมยังอยู่ ไม่หาย
      if (res.needsRereg) {
        $('#myForm').prepend('<div class="col-12"><div class="alert alert-info mb-3">🔁 <b>ลงทะเบียนใหม่</b> — เพิ่มเพื่อนเรียบร้อยแล้ว '
          + 'กรุณาตรวจ/กรอกข้อมูลอีกครั้ง (สถานะการชำระเงินเดิมของคุณยังอยู่)</div></div>');
        var p = res.prefill || {};
        if (p.name) $('#name').val(p.name);
        if (p.org) $('#device').val(p.org);
        if (p.tel) $('#phone').val(p.tel);
        if (p.email) $('#place').val(p.email);
        var base = String(p.course || '').slice(0, 2).toUpperCase() + '70';
        if (['PC70', 'FC70', 'IC70'].indexOf(base) >= 0) { $('#problem').val(base).trigger('change'); }
      }
    }

    // ย่อรูปฝั่ง client ก่อนส่ง (กันไฟล์ต้นฉบับจากกล้องมือถือ 5-10MB ชน limit ของ serverless function)
    // ย่อให้กว้างสุด maxW แล้วบีบเป็น JPEG คุณภาพ q — ได้ไฟล์ ~200-500KB พอสำหรับรูปประจำตัว
    function resizeImage(file, maxW, q) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          URL.revokeObjectURL(url);
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', q).replace(/^.*,/, ''));
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์รูปไม่ได้')); };
        img.src = url;
      });
    }

    function submitForm() {
      var fileInput = $('#file')[0];
      if (fileInput.files.length === 0) {
        Swal.fire({ icon: 'warning', title: 'กรุณาอัพโหลดรูปประจำตัว' });
        return;
      }
      $.LoadingOverlay('show');
      var file = fileInput.files[0];
      var problem = $('#problem').val();
      var batch = $('#batch').val();
      var courseInfo = problem;
      if (problem === 'PC70' && batch) { courseInfo = problem + ' - ' + batch; }
      var name = $('#name').val();
      var device = $('#device').val();

      resizeImage(file, 1280, 0.82)
        .then(function (base64File) {
          return post('/api/public/reg-submit', {
            idToken: state.idToken,
            name: name, tel: $('#phone').val(), org: device, email: $('#place').val(),
            course: courseInfo, examOrder: $('#examOrder').val(),
            photoBase64: base64File, photoMime: 'image/jpeg',
          });
        })
        .then(function (r) {
          $.LoadingOverlay('hide');
          try {
            liff.sendMessages([{ type: 'text', text: 'คุณ : ' + name + ' สังกัด : ' + device + ' หลักสูตร ' + courseInfo + ' ลงทะเบียนเรียบร้อยแล้ว' }])
              .then(function () { if (liff.isInClient && liff.isInClient()) liff.closeWindow(); })
              .catch(function (err) { console.error('sendMessages error:', err); });
          } catch (err) { console.error('sendMessages error:', err); }
          Swal.fire({ icon: 'success', title: 'ลงทะเบียนเรียบร้อย', allowOutsideClick: false, confirmButtonText: 'ตกลง' })
            .then(function () { goNext(r.nextUrl); });
        })
        .catch(function (e) {
          $.LoadingOverlay('hide');
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: e.message, allowOutsideClick: false, confirmButtonText: 'ตกลง' });
        });
    }
  })();
  </script>
</body>

</html>
